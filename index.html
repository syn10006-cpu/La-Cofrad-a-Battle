<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111315">
  <title>La Cofradía Battle v0.3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>LA COFRADÍA BATTLE</h1>
        <p>v0.3 · prototipo web</p>
      </div>
      <div class="buttons">
        <button id="selectBtn" type="button">Personajes</button>
        <button id="cpuBtn" type="button">CPU: ON</button>
        <button id="restartBtn" type="button">Reiniciar</button>
      </div>
    </header>

    <section class="game-shell">
      <canvas id="game" width="640" height="360" tabindex="0"
        aria-label="La Cofradía Battle, juego de pelea 2D"></canvas>
    </section>

    <section class="help">
      <span><kbd>A</kbd><kbd>D</kbd> mover</span>
      <span><kbd>Shift</kbd> correr</span>
      <span><kbd>W</kbd> saltar</span>
      <span><kbd>S</kbd> agachar</span>
      <span><kbd>J</kbd> débil</span>
      <span><kbd>K</kbd> fuerte</span>
      <span><kbd>L</kbd> bloquear</span>
      <span><kbd>H</kbd> hitboxes</span>
      <span><kbd>Enter</kbd> confirmar</span>
    </section>

    <p id="status" class="status" aria-live="polite">Cargando…</p>
  </main>

  <script type="module" src="src/game.js"></script>
</body>
</html>
